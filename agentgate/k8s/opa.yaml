# The ConfigMap for OPA's policy bundle is deliberately NOT defined here as
# static YAML — that would let it drift from the real source files in
# policy/agentgate.rego and policy/data.json. Instead generate it directly
# from those files before applying this manifest:
#
#   kubectl create configmap agentgate-policy \
#     --from-file=agentgate.rego=policy/agentgate.rego \
#     --from-file=data.json=policy/data.json \
#     -n agentgate
#
# Re-run that command (it supports --dry-run=client -o yaml | kubectl apply -f -
# for updates) any time the policy changes, then restart the OPA deployment
# below to pick it up: kubectl rollout restart deployment/opa -n agentgate

apiVersion: apps/v1
kind: Deployment
metadata:
  name: opa
  namespace: agentgate
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opa
  template:
    metadata:
      labels:
        app: opa
    spec:
      containers:
        - name: opa
          image: openpolicyagent/opa:0.65.0
          args:
            - "run"
            - "--server"
            - "--addr=0.0.0.0:8181"
            - "/policy/agentgate.rego"
            - "/policy/data.json"
          ports:
            - containerPort: 8181
          volumeMounts:
            - name: policy
              mountPath: /policy
      volumes:
        - name: policy
          configMap:
            name: agentgate-policy
---
apiVersion: v1
kind: Service
metadata:
  name: opa
  namespace: agentgate
spec:
  selector:
    app: opa
  ports:
    - port: 8181
      targetPort: 8181
