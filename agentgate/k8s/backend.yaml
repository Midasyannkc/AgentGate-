apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentgate-backend
  namespace: agentgate
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agentgate-backend
  template:
    metadata:
      labels:
        app: agentgate-backend
    spec:
      containers:
        - name: backend
          image: agentgate-backend:latest  # built by the CI pipeline; see .github/workflows
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6000
          readinessProbe:
            httpGet:
              path: /healthz
              port: 6000
            initialDelaySeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: agentgate-backend
  namespace: agentgate
spec:
  selector:
    app: agentgate-backend
  ports:
    - port: 6000
      targetPort: 6000
